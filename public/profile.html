<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="js/origin-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile & Settings — Northstar Financial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-slot"></aside>

    <div class="main-area">
      <div class="mobile-topbar">
        <div class="brand"><span class="brand-mark">N</span><span>Northstar</span></div>
        <a href="notifications.html" class="bell-btn" aria-label="Notifications" style="color:#fff;">
          <span class="bell-dot"></span>
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </a>
      </div>

      <header class="topbar">
        <h1 id="topbar-title">Profile & Settings</h1>
        <div class="topbar-right">
          <a href="notifications.html" class="bell-btn" aria-label="Notifications">
            <span class="bell-dot"></span>
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          </a>
          <a href="profile.html" class="user-chip">
            <span class="avatar" id="user-avatar"></span>
            <span class="user-chip-name" id="user-chip-name"></span>
          </a>
        </div>
      </header>

      <main class="content">
        <div class="card" style="max-width:520px;">
          <div class="profile-hero">
            <span class="avatar avatar-lg" id="profile-avatar"></span>
            <div class="profile-hero-text">
              <div class="profile-hero-name" id="profile-hero-name"></div>
              <div class="profile-hero-sub">Account holder</div>
            </div>
          </div>
          <div id="profile-loading">
            <div class="skeleton-row"></div>
            <div class="skeleton-row"></div>
          </div>

          <form id="profile-form" style="display:none;">
            <div class="form-group">
              <label class="form-label">Username</label>
              <input class="form-input" type="text" id="profile-username" disabled>
            </div>
            <div class="form-group">
              <label class="form-label">Full name</label>
              <input class="form-input" type="text" id="profile-name" disabled>
            </div>
            <div class="form-group">
              <label class="form-label" for="profile-email">Email</label>
              <input class="form-input" type="email" id="profile-email" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="profile-phone">Phone</label>
              <input class="form-input" type="text" id="profile-phone">
            </div>
            <div class="form-error" id="profile-error" style="display:none;"></div>
            <button class="btn btn-primary" type="submit" id="profile-submit">
              <span id="profile-submit-label">Save Changes</span>
            </button>
          </form>
        </div>
      </main>
    </div>

    <nav class="mobile-tabbar" id="mobile-tabbar-slot"></nav>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/money.js"></script>
  <script src="js/app.js"></script>
  <script src="js/mobile-nav.js" defer></script>
  <script src="js/profile.js"></script>
</body>
</html>
