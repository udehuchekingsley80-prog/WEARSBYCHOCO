<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="js/origin-guard.js"></script><script src="js/locale.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create New Password — Northstar Financial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-visual">
      <h1>Create new password</h1>
      <p>Your identity has been verified. Please choose a strong, unique password for your account.</p>
    </div>
    <div class="auth-form-side">
      <div class="auth-form-box">
        <div class="brand"><span class="brand-mark">N</span><span>Northstar Financial</span></div>
        <h2>Set a new password</h2>
        <div class="auth-subtitle">Must be at least 8 characters with uppercase, lowercase, number, and special character.</div>

        <div class="auth-error-box" id="reset-error"></div>

        <form id="reset-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="password">New password</label>
            <input class="form-input" type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
            <div class="form-hint" id="password-hint" style="display:none;"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <input class="form-input" type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
          </div>

          <button class="btn btn-primary btn-block" type="submit" id="reset-submit">
            <span id="reset-submit-label">Reset password</span>
          </button>
        </form>
      </div>
    </div>
  </div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/reset-password.js"></script>
<script>
  setInterval(() => {
    document.querySelectorAll('a, div').forEach(el => {
      if (el.textContent && el.textContent.trim() === 'Powered by Netlify') {
        el.style.display = 'none';
      }
    });
  }, 1000);
</script>
</body>
</html>
