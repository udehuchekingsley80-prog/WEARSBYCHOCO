<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="js/origin-guard.js"></script><script src="js/locale.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — Northstar Financial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app-shell.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-slot"></aside>

    <div class="main-area">
      <div class="mobile-topbar">
        <div class="brand"><span class="brand-mark">N</span><span>Northstar</span></div>
        <a href="notifications.html" class="bell-btn" aria-label="Notifications" style="color:#fff;">
          <span class="bell-dot"></span>
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </a>
      </div>

      <header class="topbar">
        <h1 id="topbar-title">Notifications</h1>
        <div class="topbar-right">
          <a href="notifications.html" class="bell-btn" aria-label="Notifications">
            <span class="bell-dot"></span>
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          </a>
          <a href="profile.html" class="user-chip">
            <span class="avatar" id="user-avatar"></span>
            <span class="user-chip-name" id="user-chip-name"></span>
          </a>
        </div>
      </header>

      <main class="content">
        <div class="section-header">
          <h2>Send Message</h2>
        </div>
        <div class="card mb-16">
          <form id="send-message-form" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="message-to-email">Recipient Email</label>
                <input class="form-input" type="email" id="message-to-email" name="toEmail" placeholder="recipient@example.com" autocomplete="email" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="message-subject">Subject</label>
                <input class="form-input" type="text" id="message-subject" name="subject" placeholder="Message subject" required>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="message-body">Message</label>
              <textarea class="form-textarea" id="message-body" name="body" rows="6" placeholder="Type your message here..." required></textarea>
            </div>
            <div class="flex gap-8">
              <button class="btn btn-primary" type="submit" id="send-message-btn">
                <span id="send-message-btn-label">Send Message</span>
              </button>
            </div>
            <div class="form-error" id="send-message-error" style="display:none; margin-top:10px;"></div>
          </form>
        </div>

        <div class="section-header">
          <h2>In-App Notifications</h2>
          <button class="btn btn-outline btn-sm" id="mark-all-read-btn" type="button">Mark all read</button>
        </div>
        <div id="notifications-list" class="mb-16">
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
        </div>

        <div class="section-header"><h2>Email Log</h2></div>
        <div class="table-wrapper" id="emails-wrapper">
          <div style="padding:16px;"></div>
        </div>
      </main>
    </div>

    <nav class="mobile-tabbar" id="mobile-tabbar-slot"></nav>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/money.js"></script>
  <script src="js/app.js"></script>
  <script src="js/mobile-nav.js" defer></script>
  <script src="js/notifications.js"></script>

<script>
  setInterval(() => {
    document.querySelectorAll('a, div').forEach(el => {
      if (el.textContent && el.textContent.trim() === 'Powered by Netlify') {
        el.style.display = 'none';
      }
    });
  }, 1000);
</script>
</body>
</html>
