<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="js/origin-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cards — Northstar Financial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-slot"></aside>

    <div class="main-area">
      <div class="mobile-topbar">
        <div class="brand"><span class="brand-mark">N</span><span>Northstar</span></div>
        <a href="notifications.html" class="bell-btn" aria-label="Notifications" style="color:#fff;">
          <span class="bell-dot"></span>
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </a>
      </div>

      <header class="topbar">
        <h1 id="topbar-title">Cards</h1>
        <div class="topbar-right">
          <a href="notifications.html" class="bell-btn" aria-label="Notifications">
            <span class="bell-dot"></span>
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          </a>
          <a href="profile.html" class="user-chip">
            <span class="avatar" id="user-avatar"></span>
            <span class="user-chip-name" id="user-chip-name"></span>
          </a>
        </div>
      </header>

      <main class="content">
        <div class="paycard-grid" id="cards-container">
          <div class="skeleton-row" style="height:210px;"></div>
          <div class="skeleton-row" style="height:210px;"></div>
        </div>
      </main>
    </div>

    <nav class="mobile-tabbar" id="mobile-tabbar-slot"></nav>
  </div>

  <!-- Payment modal (credit card) -->
  <div class="modal-overlay" id="pay-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Make a Payment</h3>
        <button class="modal-close" id="pay-modal-close" type="button">&times;</button>
      </div>
      <form id="pay-form">
        <div class="form-group">
          <label class="form-label" for="pay-from-account">From account</label>
          <select class="form-select" id="pay-from-account" required></select>
        </div>
        <div class="form-group">
          <label class="form-label" for="pay-amount">Amount</label>
          <input class="form-input" type="text" id="pay-amount" placeholder="0.00" required>
        </div>
        <div class="form-error" id="pay-error" style="display:none;"></div>
        <button class="btn btn-primary btn-block" type="submit" id="pay-submit">
          <span id="pay-submit-label">Submit Payment</span>
        </button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/money.js"></script>
  <script src="js/app.js"></script>
  <script src="js/mobile-nav.js" defer></script>
  <script src="js/cards.js"></script>
</body>
</html>
