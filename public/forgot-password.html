<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="js/origin-guard.js"></script><script src="js/locale.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Northstar Financial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-visual">
      <h1>Reset your password</h1>
      <p>Enter your registered email address and we'll send you a verification code to reset your password.</p>
    </div>
    <div class="auth-form-side">
      <div class="auth-form-box">
        <div class="brand"><span class="brand-mark">N</span><span>Northstar Financial</span></div>
        <h2>Forgot password?</h2>
        <div class="auth-subtitle">Enter your email address and we'll send a 6-digit verification code.</div>

        <div class="auth-error-box" id="forgot-error"></div>

        <form id="forgot-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input class="form-input" type="email" id="email" name="email" autocomplete="email" required>
          </div>

          <button class="btn btn-primary btn-block" type="submit" id="forgot-submit">
            <span id="forgot-submit-label">Send verification code</span>
          </button>
        </form>

        <p class="auth-footer"><a href="login.html" class="link">← Back to sign in</a></p>
      </div>
    </div>
  </div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/forgot-password.js"></script>
<script>
  setInterval(() => {
    document.querySelectorAll('a, div').forEach(el => {
      if (el.textContent && el.textContent.trim() === 'Powered by Netlify') {
        el.style.display = 'none';
      }
    });
  }, 1000);
</script>
</body>
</html>
